services:
  app:
    build: .
    image: enterprise-ai-chat-assistant:latest
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_INSECURE_DEV_ONLY_SECRET_KEY_1234567890}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RAG_TOP_K: "4"
      RAG_SCORE_THRESHOLD: "0.35"
      AGENT_MAX_STEPS: "8"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  app_data:
